[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "balsa"
description = "logging utility"
# readme.rst is a generated copy of docs/source/readme.rst (see scripts/sphinx.bat and the publish workflow)
readme = "readme.rst"
authors = [{ name = "James Abel", email = "j@abel.co" }]
license = "MIT"
keywords = ["logging", "utility"]
# Supported Python versions follow the CI matrix (.github/workflows/ci.yml): 3.11 is the minimum tested version.
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = ["appdirs", "attrs", "mttkinter", "python-dateutil", "yasf", "tobool"]
# the version lives in balsa/__version__.py; setuptools reads it statically, without importing the package
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jamesabel/balsa"
Documentation = "https://balsa.readthedocs.io/"

[tool.setuptools]
packages = ["balsa"]

[tool.setuptools.dynamic]
version = { attr = "balsa.__version__.__version__" }

[tool.setuptools.package-data]
balsa = ["py.typed"]

# Development environment, managed by uv: "uv sync" creates .venv with the project (editable) and this group.
# uv.lock pins the resolved versions; "uv lock --upgrade" refreshes them.
[dependency-groups]
dev = [
    # cloud services (optional at runtime, soft imports in balsa)
    # balsa supports sentry-sdk 2.x and 3.x. The development environment has the latest; CI also runs the Sentry tests
    # against 2.x.
    "sentry-sdk[flask]",
    "awsimple",
    # docs
    "sphinx",
    # dev only
    "semantic_version",
    "pytest-pycharm",
    "moto",
    "ismain",
    "types-python-dateutil",
    "python-dotenv",
    "pygments",
    # libraries that can potentially interfere with GUI logging
    "PyQt5",
    "PyQt5-stubs",
    "PySide6",
    "matplotlib",
    # packaging
    "twine",
    # linter/formatter and type checker
    "ruff",
    "ty",
    # testing
    "pytest",
    "coverage",
    "pytest-cov",
    "pytest-randomly",
    "pytest-order",
    "pywin32; sys_platform == 'win32'",
    "types-pywin32",
    "types-pyautogui",
    # pyautogui
    "pyobjc-core; sys_platform == 'darwin'",
    "pyobjc; sys_platform == 'darwin'",
    "pyautogui; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[tool.ruff]
line-length = 192
# ruff covers the package and its tests, as black and flake8 did
extend-exclude = ["docs", "examples", "temp"]

[tool.ruff.lint]
# pycodestyle and pyflakes: the rule set flake8 checked before the move to ruff
select = ["E", "F", "W"]
ignore = [
    "E402", # module level import not at top of file
    "F401", # imported but unused
    "E501", # line too long
]

[tool.uv]
constraint-dependencies = [
    # PyQt5-Qt5 5.15.2 is the last release with a Windows wheel (later releases are macOS/Linux only, with no sdist)
    "pyqt5-qt5==5.15.2; sys_platform == 'win32'",
]
# Wheels only, so a package with no wheel for a Python version fails the install instead of silently compiling from
# source. The exceptions build from source: balsa itself, and pure-Python packages that are only published as sdists
# (mttkinter, sqlitedict, and pyautogui with its helper packages), which build cleanly with no compiler.
no-build = true
no-binary-package = ["balsa", "mttkinter", "sqlitedict", "pyautogui", "pytweening", "pyscreeze", "pygetwindow", "mouseinfo", "pyrect"]
