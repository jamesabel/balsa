[pytest]
# Use sys-level output capture instead of pytest's default fd-level capture. fd capture dup2()s the OS-level stdout/stderr between test phases, which
# closes the Windows handles Tcl cached for its standard channels. With those stale handle values being reused, a later tkinter.Tk() in the same process
# intermittently fails with TclError "Can't find a usable init.tcl ... couldn't read file ... No error" (or tk.tcl, or 'invalid command name
# "tcl_findLibrary"'). Measured: ~0.6% of Tk root creations fail with --capture=fd, 0 of 1200 with --capture=sys. Not a balsa runtime issue - real apps
# don't swap their OS-level std handles between Tk creations.
addopts = --capture=sys
