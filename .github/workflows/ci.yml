# Continuous integration: format check, lint, type check, package build and the test suite with coverage, on every pull
# request and on pushes to main.
#
# Runs on Windows only: the test helpers import win32gui (test_balsa/popup_window.py) and the GUI tests open real Tk
# dialog boxes and dismiss them with pyautogui, which needs the interactive desktop the hosted Windows runners provide.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Version policy: test the minimum supported version, the latest fully released version, and the upcoming
        # pre-release. As of 2026-11: 3.11 minimum, 3.15 latest stable. The 3.16 pre-release is NOT in the matrix yet
        # because matplotlib (at least) publishes no cp316 wheel, and uv is set to install from wheels only
        # ([tool.uv] no-build in pyproject.toml, which also lists the pure-Python packages that are built from source).
        # Add "3.16" once "uv sync --python 3.16" succeeds, and update this list whenever a new Python is released.
        python-version: ["3.11", "3.15"]
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved, a SHA cannot); the trailing comment is the version.
      # Dependabot (.github/dependabot.yml) keeps the pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # uv installs this Python itself (pre-releases included) and uses it for the project environment
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # Installs the project (editable) and the dev dependency group into .venv, at the versions pinned in uv.lock.
        # --locked fails if uv.lock is out of date with pyproject.toml. Wheels only ([tool.uv] no-build in
        # pyproject.toml), so a missing wheel for this Python version fails here instead of silently compiling from source.
        run: uv sync --locked
      - name: Format check (ruff)
        run: uv run ruff format --check
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Type check (ty)
        run: uv run ty check
      - name: Build sdist and wheel
        # Same build as .github/workflows/publish.yml (which only runs on a release), so packaging breakage shows up here.
        # The readme copies are regenerated first, exactly as the publish workflow does.
        shell: bash
        run: |
          cp docs/source/readme.rst readme.rst
          cp docs/source/readme.rst balsa/readme.rst
          uv build
          uv run twine check --strict dist/*
      - name: Close stray dialog boxes on the runner desktop
        # Hosted runners sometimes boot with a Windows dialog already open (seen: "System Properties - Windows created
        # a temporary paging file ..."). The GUI tests look for any visible dialog box with an OK button
        # (test_balsa/popup_window.py), so a leftover one fails the tests that assert no popup appears.
        shell: uv run python {0}
        run: |
          import time

          import win32con
          import win32gui


          def visible_dialogs() -> list:
              dialogs: list = []

              def collect(hwnd: int, found: list) -> None:
                  if win32gui.IsWindowVisible(hwnd) and win32gui.GetClassName(hwnd) == "#32770":
                      found.append(hwnd)

              win32gui.EnumWindows(collect, dialogs)
              return dialogs


          # closing one dialog box can reveal another (the paging file message is followed by "Performance Options"), so repeat
          for attempt in range(10):
              dialogs = visible_dialogs()
              if not dialogs:
                  break
              for hwnd in dialogs:
                  print(f"closing stray dialog box: {win32gui.GetWindowText(hwnd)!r}")
                  win32gui.PostMessage(hwnd, win32con.WM_CLOSE, 0, 0)
              time.sleep(2.0)
          remaining = [win32gui.GetWindowText(hwnd) for hwnd in visible_dialogs()]
          if remaining:
              raise SystemExit(f"dialog boxes still open: {remaining}")
      - name: Test (pytest)
        # Coverage is configured in .coveragerc (balsa package only, branch coverage). --cov-fail-under fails this step
        # when total coverage drops below 80% (86% as of 2026-11); the gate is here rather than in .coveragerc so that
        # local partial runs with --cov are not failed by it. The terminal report goes to the
        # log, the markdown report to the job summary, the HTML report to an artifact and the XML report to Codecov.
        run: uv run pytest --cov --cov-fail-under=80 --cov-report=term --cov-report=html --cov-report=markdown:coverage.md --cov-report=xml
      - name: Test Sentry support with sentry-sdk 2 (pytest)
        # uv.lock pins sentry-sdk 3.x, so the step above tests balsa with 3.x. balsa also supports 2.x, which configures
        # log handling differently: this runs the Sentry tests again with the latest 2.x layered on top.
        run: uv run --with "sentry-sdk[flask]<3" pytest test_balsa/test_sentry.py test_balsa/test_sentry_sdk_versions.py
      - name: Upload coverage to Codecov
        # Feeds the coverage badge in the readme and Codecov's pull request comments. Skipped for Dependabot pull
        # requests, which run without access to repository secrets and so have no upload token.
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: true
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.md') != '' }}
        shell: bash
        env:
          # passed through the environment rather than expanded into the script text
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          {
            echo "## Coverage (Python $PYTHON_VERSION)"
            echo
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        if: ${{ !cancelled() && hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov
          # upload-artifact skips hidden files by default; htmlcov contains a .gitignore, which is not needed
          if-no-files-found: error
