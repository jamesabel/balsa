# Continuous integration: format check, lint, type check and the test suite with coverage, on every pull request and on
# pushes to main.
#
# Runs on Windows only: the test helpers import win32gui (test_balsa/popup_window.py) and the GUI tests open real Tk
# dialog boxes and dismiss them with pyautogui, which needs the interactive desktop the hosted Windows runners provide.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Version policy: test the minimum supported version, the latest fully released version, and the upcoming
        # pre-release. As of 2026-11: 3.11 minimum, 3.15 latest stable. The 3.16 pre-release is NOT in the matrix yet
        # because pywin32 and matplotlib publish no cp316 wheels, and binary packages are never built from source.
        # Add "3.16" (with allow-prereleases, already set below) once the dev requirements install from wheels on it,
        # and update this list whenever a new Python is released.
        python-version: ["3.11", "3.15"]
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        # Wheels only (--only-binary :all:), so a missing wheel for this Python version fails here instead of silently
        # compiling from source. The --no-binary exceptions are pure-Python packages that have only ever been published
        # as sdists (mttkinter, and pyautogui with its helper packages).
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --only-binary :all: --no-binary mttkinter,pyautogui,pytweening,pyscreeze,pygetwindow,mouseinfo,pyrect -r requirements-dev.txt
      - name: Format check (black)
        run: python -m black -l 192 --check balsa test_balsa setup.py
      - name: Lint (flake8)
        run: python -m flake8 --ignore=E402,F401,W503,E203,E501 balsa test_balsa
      - name: Type check (mypy)
        run: |
          python -m mypy -m balsa
          python -m mypy -m test_balsa
      - name: Close stray dialog boxes on the runner desktop
        # Hosted runners sometimes boot with a Windows dialog already open (seen: "System Properties - Windows created
        # a temporary paging file ..."). The GUI tests look for any visible dialog box with an OK button
        # (test_balsa/popup_window.py), so a leftover one fails the tests that assert no popup appears.
        shell: python
        run: |
          import time

          import win32con
          import win32gui


          def visible_dialogs() -> list:
              dialogs: list = []

              def collect(hwnd: int, found: list) -> None:
                  if win32gui.IsWindowVisible(hwnd) and win32gui.GetClassName(hwnd) == "#32770":
                      found.append(hwnd)

              win32gui.EnumWindows(collect, dialogs)
              return dialogs


          # closing one dialog box can reveal another (the paging file message is followed by "Performance Options"), so repeat
          for attempt in range(10):
              dialogs = visible_dialogs()
              if not dialogs:
                  break
              for hwnd in dialogs:
                  print(f"closing stray dialog box: {win32gui.GetWindowText(hwnd)!r}")
                  win32gui.PostMessage(hwnd, win32con.WM_CLOSE, 0, 0)
              time.sleep(2.0)
          remaining = [win32gui.GetWindowText(hwnd) for hwnd in visible_dialogs()]
          if remaining:
              raise SystemExit(f"dialog boxes still open: {remaining}")
      - name: Test (pytest)
        # Coverage is configured in .coveragerc (balsa package only, branch coverage). The terminal report goes to the
        # log, the markdown report to the job summary and the HTML report to an artifact.
        run: python -m pytest --cov --cov-report=term --cov-report=html --cov-report=markdown:coverage.md
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.md') != '' }}
        shell: bash
        run: |
          {
            echo "## Coverage (Python ${{ matrix.python-version }})"
            echo
            cat coverage.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        if: ${{ !cancelled() && hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-py${{ matrix.python-version }}
          path: htmlcov
          # upload-artifact skips hidden files by default; htmlcov contains a .gitignore, which is not needed
          if-no-files-found: error
