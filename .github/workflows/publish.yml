# Publishes to PyPI with Provenance (PEP 740 attestations) when a GitHub release is published, or when run manually.
#
# Uses PyPI "trusted publishing" (OIDC), so no API token secret is needed. The trusted publisher is registered at
#   https://pypi.org/manage/project/balsa/settings/publishing/
#   Owner: jamesabel   Repository: balsa   Workflow: publish.yml   Environment: pypi
#
# Release procedure:
#   1. bump the version (via a PR)
#   2. publish a GitHub release whose tag is the version prefixed with "v", e.g. v1.2.3
#   3. this workflow builds and uploads the distributions
# Never upload from a workstation: a local upload cannot produce Provenance.
#
# Two jobs, so that the code that builds the distributions (build backend and its dependencies) never runs in the job
# that holds the OIDC token: "build" has read-only permissions and hands the files over as an artifact, "publish" only
# downloads them and uploads to PyPI.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('balsa/__version__.py')['__version__'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' does not match package version '$version' (expected tag 'v$version')"
            exit 1
          fi
      - name: Copy readme from its source of truth
        run: |
          cp docs/source/readme.rst readme.rst
          cp docs/source/readme.rst balsa/readme.rst
      - name: Build
        # Metadata comes from pyproject.toml; setuptools reads the version from balsa/__version__.py without importing
        # the package, so the build runs in an isolated environment and needs no project dependencies installed.
        # "python -m build" builds the sdist and then builds the wheel from that sdist, which proves the sdist is complete.
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          sha256sum dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/balsa/
    permissions:
      id-token: write # OIDC token for trusted publishing and for signing the attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
