# Publishes to PyPI with Provenance (PEP 740 attestations) when a GitHub release is published, or when run manually.
#
# Uses PyPI "trusted publishing" (OIDC), so no API token secret is needed. The trusted publisher is registered at
#   https://pypi.org/manage/project/balsa/settings/publishing/
#   Owner: jamesabel   Repository: balsa   Workflow: publish.yml   Environment: pypi
#
# Release procedure:
#   1. bump the version (via a PR)
#   2. publish a GitHub release whose tag is the version prefixed with "v", e.g. v1.2.3
#   3. this workflow builds and uploads the distributions
# Never upload from a workstation: a local upload cannot produce Provenance.
#
# Two jobs, so that the code that builds the distributions (build backend and its dependencies) never runs in the job
# that holds the OIDC token: "build" has read-only permissions and hands the files over as an artifact, "publish" only
# downloads them and uploads to PyPI.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# never cancel a publish that is under way; a second run for the same ref waits
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved, a SHA cannot); the trailing comment is the version.
      # Dependabot (.github/dependabot.yml) keeps the pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv run --no-project python -c "import runpy; print(runpy.run_path('balsa/__version__.py')['__version__'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' does not match package version '$version' (expected tag 'v$version')"
            exit 1
          fi
      - name: Copy readme from its source of truth
        run: |
          cp docs/source/readme.rst readme.rst
          cp docs/source/readme.rst balsa/readme.rst
      - name: Build
        # Metadata comes from pyproject.toml; setuptools reads the version from balsa/__version__.py without importing
        # the package, so the build runs in an isolated environment and needs no project dependencies installed.
        # "uv build" builds the sdist and then builds the wheel from that sdist, which proves the sdist is complete.
        # Only the build runs here: the project environment (uv sync) is not needed, and twine runs as a standalone tool.
        run: |
          uv build
          uvx twine check --strict dist/*
          sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/balsa/
    permissions:
      id-token: write # OIDC token for trusted publishing and for signing the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
