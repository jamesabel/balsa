# Read the Docs build configuration (https://docs.readthedocs.io/en/stable/config-file/v2.html).
# Builds the Sphinx docs in docs/source, published at https://balsa.readthedocs.io/ (the "docs" badge in the readme).

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    # Sphinx only: docs/source/conf.py reads the version from balsa/__version__.py without importing balsa
    - requirements: docs/requirements.txt
